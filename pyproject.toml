[project]
name = "cseval"
version = "0.1.0"
description = "CSEval / Auto-CSEval (NAACL 2025), rebuilt from the paper on the Hugging Face release."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
hub = ["huggingface-hub>=0.24"]

[project.scripts]
cseval = "cseval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cseval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
